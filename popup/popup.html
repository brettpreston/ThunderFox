<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>ThunderFox - by 7nihilate</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>ThunderFox - by 7nihilate</h1>
        <div class="main-toggle">
            <label class="switch">
                <input id="toggle" type="checkbox" aria-label="Enable ThunderFox processing">
                <span class="slider"></span>
            </label>
            <div class="status" id="status" role="status" aria-live="polite">Disabled</div>
        </div>

        <p class="notice" id="blockedNotice" hidden></p>

        <div class="meters" id="meters" aria-hidden="true">
            <div class="meter-row">
                <span class="meter-label">In</span>
                <div class="meter"><i id="meterInput"></i></div>
                <span class="meter-value" id="meterInput-value">-&#8734;</span>
            </div>
            <div class="meter-row">
                <span class="meter-label">Out</span>
                <div class="meter"><i id="meterOutput" class="meter-out"></i></div>
                <span class="meter-value" id="meterOutput-value">-&#8734;</span>
            </div>
        </div>

        <div class="controls">
            <div class="row">
                <label for="hpToggle">Bass cut</label>
                <input id="hpToggle" type="checkbox">
            </div>
            <div class="row">
                <label for="loudness">Loudness</label>
                <input id="loudness" type="range" min="0" max="100" step="1"
                       aria-describedby="loudness-value">
                <span class="adv-value" id="loudness-value"></span>
            </div>

            <div class="eq-section">
                <div class="eq-header">
                    <div class="eq-title">Equalizer</div>
                    <button id="eqReset" class="eq-reset-btn" type="button">Reset</button>
                    <label class="switch switch-sm">
                        <input id="eqToggle" type="checkbox" aria-label="Enable equalizer">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="eq-bands" id="eqBands"></div>
            </div>

            <div class="advanced-section disabled" id="advancedSection">
                <div class="eq-header">
                    <div class="eq-title">Advanced</div>
                    <button id="advancedReset" class="eq-reset-btn" type="button">Reset</button>
                    <label class="switch switch-sm">
                        <input id="advancedToggle" type="checkbox" aria-label="Enable advanced controls">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="advanced-body" id="advancedBody"></div>
            </div>

            <div class="exempt-section">
                <div class="row">
                    <input id="exemptToggle" type="checkbox">
                    <label for="exemptToggle" id="exemptLabel">Exempt this site</label>
                </div>
                <p class="hint-text" id="exemptHint" aria-live="polite" hidden></p>
            </div>
            <button id="manageExemptions" class="manage-btn" type="button">Manage exempt sites</button>
        </div>
    </div>
    <script src="../common/sites.js"></script>
    <script src="../common/settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
